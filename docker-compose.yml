services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso
    ports:
      - "5434:5432"
    volumes:
      - pulso-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    # Fixe uma versão no .env (N8N_VERSION) depois de validar o fluxo, para uma atualização não quebrá-lo.
    image: n8nio/n8n:${N8N_VERSION:-latest}
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Local: o app em http://localhost:3000. Publicado: PULSO_APP_URL=https://SEU-APP.vercel.app no .env.
      - PULSO_APP_URL=${PULSO_APP_URL:-http://host.docker.internal:3000}
      - PULSO_AUTOMATION_SECRET=${AUTOMATION_SECRET}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./automations:/automations:ro

volumes:
  pulso-db:
  n8n-data:
