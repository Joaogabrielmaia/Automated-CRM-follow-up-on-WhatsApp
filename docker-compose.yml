services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso
    ports:
      - "5434:5432"
    volumes:
      - pulso-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - PULSO_APP_URL=http://host.docker.internal:3000
      - PULSO_AUTOMATION_SECRET=${AUTOMATION_SECRET}
      - PULSO_WEBHOOK_SECRET=${WEBHOOK_SECRET}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./automations:/automations:ro

volumes:
  pulso-db:
  n8n-data:
